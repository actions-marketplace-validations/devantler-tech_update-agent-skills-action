name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release recovery without publishing
        type: boolean
        default: false
permissions: {}
jobs:
  release:
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@0b137510d139bbf62e479d9610b0db17c972bc2b # v14.0.2
    with:
      dry-run: ${{ inputs.dry-run || false }}
      disable-issue-side-effects: true
      warn-missing-breaking-bang: true
      protected-release: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
